name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，但不取消进行中的那个 —— 半途取消会留下不完整的站点
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Pages 的项目站点挂在 /<repo>/ 子路径下，不是根路径。
          # 不设这两个变量，资源全 404、canonical 也会指向错的地方。
          FLATPAGE_BASE: /${{ github.event.repository.name }}/
          FLATPAGE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: npm run build

      # GitHub Pages 默认走 Jekyll，会吞掉下划线开头的路径
      - run: touch dist/.nojekyll

      # 和本地跑的是同一个脚本 —— 之前内联 shell 里的 grep -oE '[一-龥]'
      # 在 macOS 能用、在 CI 的 GNU grep + C locale 下报 Invalid collation character
      - name: Verify build output
        run: python3 tools/verify-dist.py dist "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
